services:
  - type: web
    name: smart-waste-management
    env: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTO_OPEN
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: COLLECTOR_CODE
        value: CLEAN2026
      - key: MONGODB_URI
        sync: false
